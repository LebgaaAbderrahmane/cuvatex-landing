# Serves the built SPA. try_files below is what makes a reload or a pasted
# link like /work/atlas-retail work — nginx hands back index.html and
# react-router renders it client-side instead of 404ing.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed filenames change every build, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never cached, or a returning visitor keeps loading an old build's HTML.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
