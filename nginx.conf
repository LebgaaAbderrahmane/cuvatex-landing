# Serves the built SPA out of the prod image.
#
# Without the try_files line, /work/atlas-retail is a 404: nginx looks for a file
# at that path and there is none — the router builds that page in the browser.
# Handing back index.html lets react-router match the URL and render it, which is
# what makes a reload or a pasted link work at all.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed asset filenames change on every build, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must never be cached, or a returning visitor keeps loading the old
  # build's HTML and asks for asset filenames that no longer exist.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
