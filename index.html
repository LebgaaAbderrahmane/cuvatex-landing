<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/Cuvatex_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CUVATEX — We design and build complete software products</title>
    <meta
      name="description"
      content="A team that builds software together, from the first idea to launch. Websites, mobile apps, and custom software for businesses."
    />
    <meta name="theme-color" content="#0E7A69" />
    <!-- NOTE: update to the real deployed domain when live, same as og:url below -->
    <link rel="canonical" href="https://cuvatex.com/" />

    <!-- Runs before first paint so a returning dark-mode/Arabic visitor gets
         no flash of the wrong theme or direction. Must stay blocking and
         inline, not deferred. Keys must match ThemeContext.jsx (studio-theme)
         and i18next-browser-languagedetector (i18nextLng). -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem('studio-theme');
          if (theme === 'dark' || theme === 'light') root.dataset.theme = theme;

          var lang = (localStorage.getItem('i18nextLng') || navigator.language || '')
            .split('-')[0];
          if (lang === 'en' || lang === 'fr' || lang === 'ar') {
            root.setAttribute('lang', lang);
            root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
          }
        } catch (e) {
          // private mode / blocked storage — fall through to markup defaults
        }
      })();
    </script>

    <!-- Open Graph (link previews on WhatsApp, LinkedIn, Facebook…) -->
    <!-- NOTE: update og:url / og:image to the real deployed domain when live -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CUVATEX" />
    <meta property="og:title" content="CUVATEX — We design and build complete software products" />
    <meta
      property="og:description"
      content="A team that builds software together, from the first idea to launch. Websites, mobile apps, and custom software for businesses."
    />
    <meta property="og:url" content="https://cuvatex.com/" />
    <meta property="og:image" content="https://cuvatex.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="CUVATEX — We design and build complete software products" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="ar_AR" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CUVATEX — We design and build complete software products" />
    <meta
      name="twitter:description"
      content="A team that builds software together, from the first idea to launch. Websites, mobile apps, and custom software for businesses."
    />
    <meta name="twitter:image" content="https://cuvatex.com/og-image.png" />
    <meta name="twitter:image:alt" content="CUVATEX — We design and build complete software products" />

    <!-- Structured data: Organization. `sameAs` (social profile links) intentionally
         omitted — none exist yet; add once the site has real social profiles. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "CUVATEX",
      "url": "https://cuvatex.com/",
      "logo": "https://cuvatex.com/Cuvatex_logo.png",
      "description": "A team that builds software together, from the first idea to launch. Websites, mobile apps, and custom software for businesses."
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
