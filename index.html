<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/Cuvatex_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CUVATEX — We design and build complete software products</title>
    <meta
      name="description"
      content="A team that builds software together, from the first idea to launch. Websites, mobile apps, and custom software for businesses."
    />
    <meta name="theme-color" content="#0E7A69" />

    <!--
      Runs before the first paint, so a returning dark-mode visitor never sees a
      white flash and an Arabic visitor never sees a left-to-right first frame.
      React sets the same three attributes later; this only wins the first frame.
      Deliberately blocking and inline — an external or deferred script paints first.
      Keys must match src/theme/ThemeContext.jsx (studio-theme) and the
      i18next-browser-languagedetector default (i18nextLng).
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem('studio-theme');
          if (theme === 'dark' || theme === 'light') root.dataset.theme = theme;

          // Same precedence as i18next-browser-languagedetector: an explicit
          // stored choice wins, otherwise fall back to the browser's own language
          // so a first-time Algerian visitor also gets RTL on frame one.
          // Either source may carry a region code such as 'ar-DZ'.
          var lang = (localStorage.getItem('i18nextLng') || navigator.language || '')
            .split('-')[0];
          if (lang === 'en' || lang === 'fr' || lang === 'ar') {
            root.setAttribute('lang', lang);
            root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
          }
        } catch (e) {
          /* private mode / blocked storage — fall through to the markup defaults */
        }
      })();
    </script>

    <!-- Open Graph (link previews on WhatsApp, LinkedIn, Facebook…) -->
    <!-- NOTE: update og:url / og:image to the real deployed domain when live -->
    <meta property="og:type" content="website" />

    <meta property="og:image:type" content="image/png" />

    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="ar_AR" />
